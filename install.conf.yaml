- defaults:
    link:
      create: true
      relink: true
      force: true
    shell:
      quiet: true
- shell:
  - description: Validating sudo credentials
    command: "sudo --validate"
- clean: ['~']
- link:
    # ln -s ~/.dotfiles/... ~/...
    ~/.gitconfig: git/gitconfig
    ~/.gitignore_global: git/gitignore
    ~/.gitconfig-statamic: git/gitconfig-statamic
    ~/.gitignore_statamic: git/gitignore-statamic
    ~/.composer/composer.json: composer/composer.json
    ~/.config/ghostty: ghostty
    ~/.agents: ai
    ~/.claude/CLAUDE.md: ai/AGENTS.md
    ~/.claude/skills: ai/skills
    ~/.claude-statamic/CLAUDE.md: ai/AGENTS.md
    ~/.claude-statamic/skills: ai/skills
    ~/.codex/AGENTS.md: ai/AGENTS.md
    ~/.config/starship.toml: starship/starship.toml
    ~/.hammerspoon: hammerspoon
    ~/.vimrc: vim/.vimrc
    ~/.zshrc: zsh/.zshrc
    ~/.local/bin/worktree: bin/worktree
- create:
    - ~/Code
    - ~/Code/Freelance
    - ~/Code/OpenSource
    - ~/Code/Personal
    - ~/Code/SideProjects
    - ~/Code/Statamic
    - ~/Code/Throwaway
- shell:
  - description: Hushing login
    command: "[ -f ~/.hushlogin ] || touch ~/.hushlogin"
  - description: Installing Oh My Zsh
    command: "[ -d ~/.oh-my-zsh ] || /bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)\""
  - description: Install Oh My Zsh Syntax Highlighting
    command: "[ -d ~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting ] || git clone https://github.com/zsh-users/zsh-syntax-highlighting.git ~/.oh-my-zsh/plugins/zsh-syntax-highlighting"
  - description: Installing Homebrew
    command: "[ -x \"$(which brew)\" ] || /bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\" && echo >> /Users/duncan/.zprofile && echo 'eval \"$(/opt/homebrew/bin/brew shellenv)\"' >> /Users/duncan/.zprofile && eval \"$(/opt/homebrew/bin/brew shellenv)\""
  - description: Updating Homebrew
    command: "brew update"
  - description: Installing Brewfile bundle
    command: "brew bundle"
  - description: Cleaning up Homebrew
    command: "brew cleanup"
  - description: Installing Claude Code
    command: "[ -x ~/.local/bin/claude ] || curl -fsSL https://claude.ai/install.sh | bash"
  - description: Switch Git remote to SSH
    command: "git remote set-url origin git@github.com:duncanmcclean/dotfiles.git"
  - description: Apply macOS Preferences
    command: "./.macos"
    quiet: false
  - description: Add to Laravel Herd's paths
    command: "herd park ~/Code/Freelance && herd park ~/Code/OpenSource && herd park ~/Code/Personal && herd park ~/Code/SideProjects && herd park ~/Code/Statamic && herd park ~/Code/Throwaway  herd link ~/.dotfiles/http duncan"
  - description: Link http directory
    command: "cd ~/.dotfiles/http && herd link duncan"
