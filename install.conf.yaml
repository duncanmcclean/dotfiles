- defaults:
    link:
      create: true
      relink: true
      force: true
    shell:
      quiet: true
      stderr: true
- shell:
  - description: Validating sudo credentials
    command: "sudo --validate"
- clean: ['~']
- link:
    # ln -s ~/.dotfiles/... ~/...
    ~/.gitconfig: git/gitconfig
    ~/.gitignore_global: git/gitignore
    ~/.gitconfig-statamic: git/gitconfig-statamic
    ~/.gitignore_statamic: git/gitignore-statamic
    ~/.composer/composer.json: composer/composer.json
    ~/.config/ghostty: ghostty
    ~/.agents: ai
    ~/.claude/CLAUDE.md: ai/AGENTS.md
    ~/.claude/settings.json: ai/claude/settings.json
    ~/.claude/skills: ai/skills
    ~/.claude-statamic/CLAUDE.md: ai/AGENTS.md
    ~/.claude-statamic/settings.json: ai/claude-statamic/settings.json
    ~/.claude-statamic/skills: ai/skills
    ~/.codex/AGENTS.md: ai/AGENTS.md
    ~/.codex/config.toml: ai/codex/config.toml
    ~/.config/starship.toml: starship/starship.toml
    ~/.hammerspoon: hammerspoon
    ~/.vimrc: vim/.vimrc
    ~/.zshrc: zsh/.zshrc
    ~/.local/bin/worktree: bin/worktree
- create:
    - ~/Code
    - ~/Code/Freelance
    - ~/Code/OpenSource
    - ~/Code/Personal
    - ~/Code/SideProjects
    - ~/Code/Statamic
    - ~/Code/Throwaway
- shell:
  - description: Hushing login
    command: "[ -f ~/.hushlogin ] || touch ~/.hushlogin"
  - description: Installing Oh My Zsh
    command: "[ -f ~/.oh-my-zsh/oh-my-zsh.sh ] || { rm -rf ~/.oh-my-zsh && GIT_CONFIG_GLOBAL=/dev/null KEEP_ZSHRC=yes /bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)\" \"\" --unattended; }"
  - description: Install Oh My Zsh Syntax Highlighting
    command: "[ -d ~/.oh-my-zsh/plugins/zsh-syntax-highlighting ] || GIT_CONFIG_GLOBAL=/dev/null git clone https://github.com/zsh-users/zsh-syntax-highlighting.git ~/.oh-my-zsh/plugins/zsh-syntax-highlighting"
- shell:
  - description: Installing Homebrew
    command: "[ -x /opt/homebrew/bin/brew ] || { NONINTERACTIVE=1 /bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\" && echo 'eval \"$(/opt/homebrew/bin/brew shellenv)\"' >> ~/.zprofile; }"
  - description: Updating Homebrew
    command: "/opt/homebrew/bin/brew update"
  - description: Installing Brewfile bundle
    command: "/opt/homebrew/bin/brew bundle"
  - description: Accepting the Xcode license
    command: "! [ -d /Applications/Xcode.app ] || sudo xcodebuild -license accept"
  - description: Cleaning up Homebrew
    command: "/opt/homebrew/bin/brew cleanup"
- shell:
  - description: Installing Claude Code
    command: "[ -x ~/.local/bin/claude ] || curl -fsSL https://claude.ai/install.sh | bash"
  - description: Switch Git remote to SSH
    command: "ssh -o BatchMode=yes -T git@github.com 2>&1 | grep -q 'successfully authenticated' && git remote set-url origin git@github.com:duncanmcclean/dotfiles.git || echo 'No SSH access to GitHub yet, leaving the remote on HTTPS'"
    stdout: true
- shell:
  - description: Apply macOS Preferences
    command: "./.macos"
    quiet: false
- shell:
  - description: Checking Herd has been opened
    command: "command -v herd > /dev/null || { echo 'Open Herd, then re-run ./install'; exit 1; }"
    stdout: true
  - description: Add to Laravel Herd's paths
    command: "herd park ~/Code/Freelance && herd park ~/Code/OpenSource && herd park ~/Code/Personal && herd park ~/Code/SideProjects && herd park ~/Code/Statamic && herd park ~/Code/Throwaway"
  - description: Link http directory
    command: "cd ~/.dotfiles/http && herd link duncan"
- shell:
  - description: Installing global Composer packages
    command: "composer global install"
